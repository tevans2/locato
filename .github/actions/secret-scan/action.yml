name: Scan tracked history for secrets
description: Fail before building or deploying if Gitleaks detects an unreviewed credential.
runs:
  using: composite
  steps:
    - name: Install checksum-pinned Gitleaks
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$archive"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/gitleaks-bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
        echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
    - name: Scan full Git history with redacted output
      shell: bash
      run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="--all"
