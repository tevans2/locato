name: Deploy promo service

# The promo service (promo/worker: Cloudflare Worker + D1) deploys from main, separately from the game.
# It also serves the Studio (promo/studio, built with the video templates and a copy of the game's country data).
# Infrastructure (promo/infra, Terraform) stays manual: ./tf plan && ./tf apply from a Mac.
on:
  push:
    branches:
      - main
    paths:
      - "promo/worker/**"
      - "promo/src/**"
      - "promo/studio/**"
      - "promo/content/**"
      - "promo/tools/locato/autopost.ts"
      - "promo/package.json"
      - "promo/package-lock.json"
      - ".github/workflows/promo-deploy.yml"
      # the game data the Studio previews with
      - "src/core/countries/**"
      - "src/core/academy/lookalikes.ts"
      - "src/core/dailyThemes.ts"
      - "public/assets/flags/**"
      - "public/assets/country-shapes/**"
  workflow_dispatch:

concurrency:
  group: promo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy the promo Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PROMO_CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets before deployment
        uses: ./.github/actions/secret-scan

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: promo/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      # The Studio previews with the real templates and the game's country data, so build that data first.
      - name: Copy the game data and build the Studio
        run: |
          bun tools/locato/sync.ts
          bun studio/build.ts

      - name: Typecheck the Worker, the Studio and the templates
        run: |
          npx tsc -p worker/tsconfig.json
          npx tsc --noEmit -p .

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply locato-promo --remote --config worker/wrangler.jsonc

      - name: Deploy
        run: npx wrangler deploy --config worker/wrangler.jsonc

      - name: Health check
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://promo.locato.quest/health
